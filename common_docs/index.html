<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>공통 참고 자료 · 프론티어올 러닝 노트</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #0066cc; --primary-focus: #0071e3;
    --canvas: #ffffff; --parchment: #f5f5f7;
    --black: #000000; --ink: #1d1d1f; --ink-80: #333333; --ink-48: #7a7a7a;
    --hairline: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 17px; line-height: 1.47; letter-spacing: -0.374px;
  }
  .global-nav {
    position: sticky; top: 0; z-index: 20; height: 44px; background: var(--black);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  }
  .global-nav .brand { color: #fff; font-size: 12px; font-weight: 600; letter-spacing: -0.12px; text-decoration: none; }
  .global-nav .meta { color: rgba(255,255,255,0.72); font-size: 12px; letter-spacing: -0.12px; }
  .sub-nav {
    position: sticky; top: 44px; z-index: 19; height: 52px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(245,245,247,0.8);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .sub-nav .category { font-size: 21px; font-weight: 600; letter-spacing: 0.231px; color: var(--ink); text-decoration: none; }
  .btn-primary {
    display: inline-block; background: var(--primary); color: #fff; border: none;
    border-radius: 9999px; padding: 8px 18px; font-size: 14px; font-family: inherit;
    text-decoration: none; cursor: pointer; transition: transform .15s;
  }
  .btn-primary:active { transform: scale(0.95); }
  .btn-primary:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }

  main.content { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }
  .eyebrow { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.224px; color: var(--ink-48); margin-bottom: 12px; }
  h1.headline { font-size: 40px; font-weight: 600; line-height: 1.10; letter-spacing: 0; margin: 0 0 14px; }
  p.tagline { font-size: 22px; font-weight: 400; line-height: 1.3; letter-spacing: 0.196px; margin: 0 0 12px; color: var(--ink-80); }
  p.notice {
    font-size: 14px; line-height: 1.6; color: var(--ink-48); letter-spacing: -0.224px;
    margin: 0 0 40px; padding: 12px 16px; background: var(--parchment); border-radius: 12px;
  }

  /* ---- 연도 ---- */
  .year { margin-bottom: 44px; }
  .year-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.374px; margin: 0 0 20px; }

  /* ---- 프로젝트 ---- */
  .project { margin-bottom: 28px; }
  .project-head h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.374px; color: var(--ink-80); margin: 0 0 10px; }

  .doc-grid { display: grid; gap: 10px; }
  a.doc-card {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--canvas); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 14px 16px; text-decoration: none; color: var(--ink);
    transition: border-color .15s;
  }
  a.doc-card:hover { border-color: var(--primary); }
  a.doc-card .icon { flex: 0 0 auto; font-size: 20px; line-height: 1; margin-top: 1px; }
  a.doc-card .detail { flex: 1 1 auto; min-width: 0; }
  a.doc-card .title { font-size: 15px; font-weight: 600; letter-spacing: -0.224px; margin-bottom: 3px; }
  a.doc-card .desc { font-size: 13px; color: var(--ink-48); letter-spacing: -0.224px; }
  a.doc-card .added { flex: 0 0 auto; font-size: 12px; color: var(--ink-48); letter-spacing: -0.12px; white-space: nowrap; padding-top: 2px; }

  .empty-note {
    font-size: 14px; color: var(--ink-48); letter-spacing: -0.224px;
    padding: 32px 0; text-align: center; border: 1px dashed var(--hairline); border-radius: 16px;
  }

  footer.site-footer { background: var(--parchment); color: var(--ink-80); padding: 48px 24px 32px; text-align: center; }
  footer.site-footer a { color: var(--ink-48); text-decoration: none; font-size: 13px; }
  footer.site-footer a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    main.content { padding: 48px 20px 72px; }
    h1.headline { font-size: 28px; }
    p.tagline { font-size: 17px; }
    .sub-nav { padding: 0 16px; }
    .sub-nav .category { font-size: 17px; }
    a.doc-card { flex-wrap: wrap; }
    a.doc-card .added { order: 3; width: 100%; }
  }
  @media (max-width: 380px) {
    .global-nav .meta { display: none; }
  }
</style>
</head>
<body>
  <nav class="global-nav">
    <a class="brand" href="../index.html">프론티어올 러닝 노트</a>
    <span class="meta">인공지능 심화(160H)</span>
  </nav>
  <nav class="sub-nav">
    <a class="category" href="#">공통 참고 자료</a>
    <a class="btn-primary" href="../index.html">전체 커리큘럼</a>
  </nav>

  <main class="content">
    <span class="eyebrow">비공개 자료실</span>
    <h1 class="headline">공통 참고 자료</h1>
    <p class="tagline">연도·프로젝트별로 모아 둔 참고 PDF입니다.</p>
    <p class="notice">이 페이지는 사이트 어디에도 링크되어 있지 않습니다. 주소(common_docs/)를 직접 아는 사람만 볼 수 있습니다.</p>

    <div id="years"></div>
    <p class="empty-note" id="empty-note" style="display:none;">아직 올라온 자료가 없습니다.</p>
  </main>

  <footer class="site-footer">
    <a href="../index.html">전체 커리큘럼으로</a>
  </footer>

  <script>
    // 자료 목록은 캐시를 우회해 불러옵니다.
    // GitHub Pages가 파일을 잠깐 캐시하기 때문에, 이 처리가 없으면
    // 방금 추가한 자료가 바로 보이지 않을 수 있습니다.
    document.write('<script src="docs.js?t=' + Date.now() + '"><\/script>');
  </script>
  <script>
    const yearsEl = document.getElementById('years');
    const emptyNote = document.getElementById('empty-note');

    function render() {
      const years = (typeof PDF_YEARS !== 'undefined' ? PDF_YEARS : [])
        .filter(y => (y.projects || []).some(p => (p.docs || []).length > 0));

      if (years.length === 0) {
        emptyNote.style.display = 'block';
        return;
      }

      yearsEl.innerHTML = years.map(year => {
        const projects = (year.projects || []).filter(p => (p.docs || []).length > 0);
        const projectsHtml = projects.map(project => {
          const docsHtml = project.docs.map(doc => {
            const desc = doc.desc ? '<div class="desc">' + doc.desc + '</div>' : '';
            const added = doc.added ? '<span class="added">' + doc.added + '</span>' : '';
            return [
              '<a class="doc-card" href="' + doc.file + '" target="_blank" rel="noopener">',
              '  <span class="icon">📄</span>',
              '  <div class="detail">',
              '    <div class="title">' + doc.title + '</div>',
              desc,
              '  </div>',
              added,
              '</a>'
            ].join('');
          }).join('');

          return [
            '<section class="project">',
            '  <div class="project-head"><h3>' + project.label + '</h3></div>',
            '  <div class="doc-grid">' + docsHtml + '</div>',
            '</section>'
          ].join('');
        }).join('');

        return [
          '<section class="year">',
          '  <div class="year-head"><h2>' + year.label + '</h2></div>',
          projectsHtml,
          '</section>'
        ].join('');
      }).join('');
    }

    render();
  </script>
</body>
</html>
