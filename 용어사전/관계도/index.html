<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용어 관계도 · 프론티어올 러닝 노트</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #0066cc; --primary-focus: #0071e3;
    --canvas: #ffffff; --parchment: #f5f5f7;
    --black: #000000; --ink: #1d1d1f; --ink-80: #333333; --ink-48: #7a7a7a;
    --hairline: #e0e0e0;
    --kind-concept: #0066cc; --kind-tool: #e8842c; --kind-deploy: #16a34a; --kind-lang: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 17px; line-height: 1.47; letter-spacing: -0.374px;
  }
  .global-nav {
    position: sticky; top: 0; z-index: 20; height: 44px; background: var(--black);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  }
  .global-nav .brand { color: #fff; font-size: 12px; font-weight: 600; letter-spacing: -0.12px; text-decoration: none; }
  .global-nav .meta { color: rgba(255,255,255,0.72); font-size: 12px; letter-spacing: -0.12px; }
  .sub-nav {
    position: sticky; top: 44px; z-index: 19; height: 52px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(245,245,247,0.8);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .sub-nav .category { font-size: 21px; font-weight: 600; letter-spacing: 0.231px; color: var(--ink); text-decoration: none; }
  .btn-primary {
    display: inline-block; background: var(--primary); color: #fff; border: none;
    border-radius: 9999px; padding: 8px 18px; font-size: 14px; font-family: inherit;
    text-decoration: none; cursor: pointer; transition: transform .15s;
  }
  .btn-primary:active { transform: scale(0.95); }
  .btn-primary:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }

  main.content { max-width: 1040px; margin: 0 auto; padding: 40px 24px 64px; }
  .eyebrow { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.224px; color: var(--ink-48); margin-bottom: 12px; }
  h1.headline { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: 0; margin: 0 0 10px; }
  p.tagline { font-size: 15px; line-height: 1.6; letter-spacing: -0.224px; margin: 0 0 20px; color: var(--ink-80); max-width: 62ch; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-80); letter-spacing: -0.12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

  .graph-wrap {
    position: relative; border: 1px solid var(--hairline); border-radius: 16px;
    background: var(--parchment); overflow: hidden;
  }
  .graph-wrap svg { display: block; width: 100%; height: 74vh; min-height: 560px; cursor: grab; }
  .graph-wrap svg:active { cursor: grabbing; }
  .cluster-bg { fill: #ffffff; fill-opacity: 0.55; stroke: #c7cdd6; stroke-width: 1px; stroke-dasharray: 4 3; }
  .cluster-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
    font-size: 12px; font-weight: 700; fill: var(--ink-80); letter-spacing: -0.12px;
    paint-order: stroke; stroke: #fff; stroke-width: 3px; pointer-events: none;
  }
  .node { cursor: pointer; }
  .node circle { stroke: #fff; stroke-width: 1.5px; transition: opacity .15s; }
  .node text {
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
    font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px;
    pointer-events: none; transition: opacity .12s;
  }
  .node .node-label.small { opacity: 0; }
  .node:hover .node-label.small, .node.active .node-label.small { opacity: 1; }
  .link { fill: none; stroke: var(--hairline); stroke-width: 1.1px; transition: opacity .15s; }
  .node.dim circle, .node.dim text { opacity: 0.15; }
  .link.dim { opacity: 0.06; }

  .graph-hint {
    position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--ink-48);
    background: rgba(255,255,255,0.85); padding: 5px 10px; border-radius: 999px;
    letter-spacing: -0.12px; pointer-events: none;
  }

  @media (max-width: 640px) {
    main.content { padding: 32px 16px 48px; }
    h1.headline { font-size: 24px; }
    .sub-nav { padding: 0 16px; }
    .sub-nav .category { font-size: 17px; }
  }
  @media (max-width: 380px) {
    .global-nav .meta { display: none; }
  }
</style>
</head>
<body>
  <nav class="global-nav">
    <a class="brand" href="../../index.html">프론티어올 러닝 노트</a>
    <span class="meta">인공지능 심화(160H)</span>
  </nav>
  <nav class="sub-nav">
    <a class="category" href="../index.html">← 용어 사전</a>
    <a class="btn-primary" href="../../index.html">전체 커리큘럼</a>
  </nav>

  <main class="content">
    <span class="eyebrow">용어 사전 · 관계도</span>
    <h1 class="headline">용어 관계도</h1>
    <p class="tagline">커리큘럼 <strong>PART</strong>별로 용어를 묶은 다음, 그 안에서 서로 <code>관련 용어</code>로 이어진 모습을 한눈에 봅니다. 원이 클수록 다른 용어와 많이 연결된 용어예요. 점 위에 마우스를 올리면 연결된 것만 밝게 남고, 클릭하면 용어사전에서 그 설명이 펼쳐집니다.</p>

    <div class="legend" id="legend"></div>

    <div class="graph-wrap">
      <svg id="graph"></svg>
      <span class="graph-hint">드래그로 화면 이동 · 휠로 확대/축소 · 마우스 오버로 연결 강조 · 클릭하면 설명으로 이동</span>
    </div>
  </main>

  <script>
    document.write('<script src="../terms.js?t=' + Date.now() + '"><\/script>');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    // CSS 변수는 SVG fill 속성에서 바로 못 읽으므로, 노드 색상은 실제 색상 값으로 따로 관리합니다.
    const KIND_HEX = { concept: '#0066cc', tool: '#e8842c', deploy: '#16a34a', lang: '#8b5cf6' };

    function buildLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = TERM_KINDS.map(k => (
        '<span class="legend-item"><span class="legend-dot" style="background:' + (KIND_HEX[k.id] || '#999') + '"></span>' +
        k.label + ' (' + TERMS.filter(t => t.kind === k.id).length + ')</span>'
      )).join('');
    }

    // PART별로 원을 묶어서 배치하는 결정적(deterministic) 레이아웃입니다.
    // d3.forceSimulation과 달리 같은 데이터를 넣으면 새로고침해도 항상 같은 모양이 나옵니다.
    function buildGraph() {
      const byId = new Map(TERMS.map(t => [t.id, t]));

      const linkSet = new Set();
      const links = [];
      TERMS.forEach(t => {
        (t.related || []).forEach(r => {
          if (!byId.has(r) || r === t.id) return;
          const key = [t.id, r].sort().join('::');
          if (linkSet.has(key)) return;
          linkSet.add(key);
          links.push({ source: t.id, target: r });
        });
      });

      const degree = new Map(TERMS.map(t => [t.id, 0]));
      links.forEach(l => {
        degree.set(l.source, (degree.get(l.source) || 0) + 1);
        degree.set(l.target, (degree.get(l.target) || 0) + 1);
      });

      // root → PART 클러스터 → 용어(leaf) 3단 계층. 값이 클수록(연결이 많을수록) 원이 커집니다.
      const hierarchyData = {
        id: 'root',
        children: TERM_CATEGORIES
          .map(cat => ({
            id: cat.id,
            name: cat.name,
            no: cat.no,
            children: TERMS.filter(t => t.part === cat.id).map(t => ({
              id: t.id,
              term: t.term,
              kind: t.kind,
              value: 1 + (degree.get(t.id) || 0) * 0.7,
            })),
          }))
          .filter(cat => cat.children.length > 0),
      };

      const svg = d3.select('#graph');
      const wrap = svg.node().parentElement;
      const width = wrap.clientWidth;
      const height = wrap.clientHeight || 640;
      svg.attr('viewBox', [0, 0, width, height]);

      const root = d3.hierarchy(hierarchyData)
        .sum(d => d.value || 0)
        .sort((a, b) => (b.value || 0) - (a.value || 0));

      d3.pack()
        .size([width - 16, height - 16])
        .padding(d => (d.depth === 0 ? 24 : 3))
        (root);
      root.each(d => { d.x += 8; d.y += 8; });

      const clusters = root.children || [];
      const leaves = root.leaves();
      const posById = new Map(leaves.map(d => [d.data.id, d]));

      // 연결이 많아 원이 큰 상위 20%만 기본으로 라벨을 보여주고, 나머지는 마우스를 올렸을 때만 보여 줍니다.
      // 용어가 늘어나도(README 기준 데이터만 추가) 항상 전체의 20% 안팎만 라벨이 남도록 상대 기준으로 계산합니다.
      const labelCount = Math.max(10, Math.ceil(leaves.length * 0.2));
      const alwaysLabeled = new Set(
        [...leaves].sort((a, b) => b.r - a.r).slice(0, labelCount).map(d => d.data.id)
      );

      const zoomLayer = svg.append('g');
      svg.call(d3.zoom().scaleExtent([0.4, 5]).on('zoom', e => zoomLayer.attr('transform', e.transform)));

      zoomLayer.append('g').attr('class', 'cluster-bgs')
        .selectAll('circle').data(clusters).join('circle')
        .attr('class', 'cluster-bg')
        .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => d.r);

      // 라벨은 원 위 중앙에 놓습니다(왼쪽 정렬로 오른쪽으로만 뻗으면 작은 클러스터에서 캔버스 밖으로 잘리기 쉽습니다).
      // 클러스터 반지름이 작을수록 글자 크기도 함께 줄여서, 렌더링 후 실제 폭이 원 지름보다 넓으면 한 번 더 줄입니다.
      const clusterLabel = zoomLayer.append('g').attr('class', 'cluster-labels')
        .selectAll('text').data(clusters).join('text')
        .attr('class', 'cluster-label')
        .attr('text-anchor', 'middle')
        .attr('x', d => d.x)
        .attr('y', d => d.y - d.r - 8)
        .style('font-size', d => Math.max(9, Math.min(12, d.r / 6)) + 'px')
        .text(d => d.data.no + ' · ' + d.data.name + ' (' + d.children.length + ')');
      clusterLabel.append('title').text(d => d.data.no + ' · ' + d.data.name + ' (' + d.children.length + ')');

      clusterLabel.each(function (d) {
        const el = d3.select(this);
        const budget = d.r * 2.1;
        let size = parseFloat(el.style('font-size'));
        let width = this.getComputedTextLength ? this.getComputedTextLength() : 0;
        while (width > budget && size > 7) {
          size -= 0.5;
          el.style('font-size', size + 'px');
          width = this.getComputedTextLength();
        }
      });

      const link = zoomLayer.append('g').attr('class', 'links')
        .selectAll('path').data(links).join('path')
        .attr('class', 'link')
        .attr('d', l => {
          const s = posById.get(l.source), t = posById.get(l.target);
          if (!s || !t) return '';
          return 'M' + s.x + ',' + s.y + ' L' + t.x + ',' + t.y;
        });

      const node = zoomLayer.append('g').attr('class', 'nodes')
        .selectAll('g').data(leaves).join('g')
        .attr('class', 'node')
        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

      node.append('circle')
        .attr('r', d => d.r)
        .attr('fill', d => KIND_HEX[d.data.kind] || '#999');

      node.append('text')
        .attr('class', d => 'node-label' + (alwaysLabeled.has(d.data.id) ? '' : ' small'))
        .attr('x', d => d.r + 4)
        .attr('y', 4)
        .text(d => d.data.term);

      node.append('title').text(d => d.data.term + ' — 클릭하면 설명으로 이동');

      const neighborsOf = id => {
        const s = new Set([id]);
        links.forEach(l => {
          if (l.source === id) s.add(l.target);
          if (l.target === id) s.add(l.source);
        });
        return s;
      };

      node.on('mouseenter', (event, d) => {
        const near = neighborsOf(d.data.id);
        node.classed('dim', n => !near.has(n.data.id));
        node.classed('active', n => near.has(n.data.id));
        link.classed('dim', l => l.source !== d.data.id && l.target !== d.data.id);
      });
      node.on('mouseleave', () => {
        node.classed('dim', false);
        node.classed('active', false);
        link.classed('dim', false);
      });
      node.on('click', (event, d) => {
        window.location.href = '../index.html#' + d.data.id;
      });
    }

    function init() {
      if (typeof TERMS === 'undefined' || typeof d3 === 'undefined') {
        setTimeout(init, 50);
        return;
      }
      buildLegend();
      buildGraph();
    }
    init();
  </script>
</body>
</html>
