<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용어 사전 · AI 프로덕트 마스터</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #0066cc; --primary-focus: #0071e3;
    --canvas: #ffffff; --parchment: #f5f5f7;
    --black: #000000; --ink: #1d1d1f; --ink-80: #333333; --ink-48: #7a7a7a;
    --hairline: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 17px; line-height: 1.47; letter-spacing: -0.374px;
  }
  .global-nav {
    position: sticky; top: 0; z-index: 20; height: 44px; background: var(--black);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  }
  .global-nav .brand { color: #fff; font-size: 12px; font-weight: 600; letter-spacing: -0.12px; text-decoration: none; }
  .global-nav .meta { color: rgba(255,255,255,0.72); font-size: 12px; letter-spacing: -0.12px; }
  .sub-nav {
    position: sticky; top: 44px; z-index: 19; height: 52px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(245,245,247,0.8);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .sub-nav .category { font-size: 21px; font-weight: 600; letter-spacing: 0.231px; color: var(--ink); text-decoration: none; }
  .btn-primary {
    display: inline-block; background: var(--primary); color: #fff; border: none;
    border-radius: 9999px; padding: 8px 18px; font-size: 14px; font-family: inherit;
    text-decoration: none; cursor: pointer; transition: transform .15s;
  }
  .btn-primary:active { transform: scale(0.95); }
  .btn-primary:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }

  main.content { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }
  .eyebrow { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.224px; color: var(--ink-48); margin-bottom: 12px; }
  h1.headline { font-size: 40px; font-weight: 600; line-height: 1.10; letter-spacing: 0; margin: 0 0 14px; }
  p.tagline { font-size: 22px; font-weight: 400; line-height: 1.3; letter-spacing: 0.196px; margin: 0 0 28px; color: var(--ink-80); }

  .filter-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .filter-row:last-of-type { margin-bottom: 18px; }
  .filter-label {
    flex: 0 0 auto; width: 34px; font-size: 11px; font-weight: 700; color: var(--ink-48);
    letter-spacing: -0.12px; padding-top: 8px;
  }
  .group-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .group-tabs button.empty { opacity: 0.4; }
  .group-tabs.kind button.active { background: var(--ink); border-color: var(--ink); }
  .group-tabs button {
    all: unset; flex: 0 0 auto; cursor: pointer; font-size: 13px; letter-spacing: -0.224px;
    color: var(--ink-48); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--hairline);
    transition: background .15s, color .15s, border-color .15s;
  }
  .group-tabs button:hover { border-color: var(--primary); color: var(--ink); }
  .group-tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .group-tabs button:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
  .group-tabs button .count { opacity: 0.6; font-variant-numeric: tabular-nums; }

  .search-input {
    display: flex; align-items: center; gap: 8px; background: var(--canvas);
    border: 1px solid var(--hairline); border-radius: 9999px; padding: 10px 18px;
    margin-bottom: 14px;
  }
  .search-input svg { flex: 0 0 auto; color: var(--ink-48); }
  .search-input input {
    all: unset; flex: 1 1 auto; font-size: 15px; font-family: inherit; color: var(--ink);
    letter-spacing: -0.224px;
  }
  .search-input input::placeholder { color: var(--ink-48); }

  .list-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .result-count { font-size: 13px; color: var(--ink-48); letter-spacing: -0.224px; margin: 0; }
  .sort-toggle { display: flex; gap: 4px; }
  .sort-toggle button {
    all: unset; cursor: pointer; font-size: 12px; letter-spacing: -0.12px; color: var(--ink-48);
    padding: 5px 11px; border-radius: 999px; border: 1px solid transparent; transition: color .15s, border-color .15s;
  }
  .sort-toggle button:hover { color: var(--ink); }
  .sort-toggle button.active { color: var(--ink); border-color: var(--hairline); }
  .sort-toggle button:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }

  /* ---- 용어 목록 ---- */
  .term-list { border-top: 1px solid var(--hairline); }
  .term { border-bottom: 1px solid var(--hairline); scroll-margin-top: 108px; }
  .term.hidden { display: none; }
  .term-head {
    all: unset; display: block; width: 100%; box-sizing: border-box; cursor: pointer;
    padding: 18px 40px 18px 2px; position: relative;
  }
  .term-head:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: -2px; border-radius: 8px; }
  .term-head::after {
    content: ""; position: absolute; right: 8px; top: 27px;
    width: 8px; height: 8px; border-right: 1.5px solid var(--ink-48); border-bottom: 1.5px solid var(--ink-48);
    transform: rotate(45deg); transition: transform .18s;
  }
  .term.open .term-head::after { transform: rotate(-135deg); }
  .term-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 7px; }
  .term-title .emoji { font-size: 19px; line-height: 1; }
  .term-title .name { font-size: 20px; font-weight: 600; letter-spacing: -0.374px; }
  .term-title .en { font-size: 13px; color: var(--ink-48); letter-spacing: -0.12px; }
  .term-short {
    display: block; font-size: 15px; line-height: 1.65; color: var(--ink-80);
    letter-spacing: -0.224px; margin-bottom: 12px; max-width: 62ch;
  }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: -0.12px;
    padding: 2px 8px; border-radius: 999px;
  }
  .badge.cat { color: var(--primary); background: rgba(0,102,204,0.08); }
  .badge.part { color: var(--ink-48); background: var(--parchment); border: 1px solid var(--hairline); font-weight: 400; }
  .badge.kind { color: var(--ink-80); background: transparent; border: 1px solid var(--hairline); font-weight: 400; }

  .term-body { display: none; padding: 0 40px 24px 2px; }
  .term.open .term-body { display: block; }
  .term-body p { font-size: 15px; line-height: 1.6; letter-spacing: -0.224px; margin: 0 0 12px; color: var(--ink-80); }
  .term-body p strong { color: var(--ink); font-weight: 600; }
  .term-note {
    font-size: 14px; line-height: 1.6; letter-spacing: -0.224px; color: var(--ink-80);
    background: var(--parchment); border-radius: 12px; padding: 12px 16px; margin: 0 0 12px;
  }
  .term-note b { font-weight: 600; color: var(--ink); }
  .term-related { font-size: 13px; color: var(--ink-48); letter-spacing: -0.224px; }
  .term-related a { color: var(--primary); text-decoration: none; }
  .term-related a:hover { text-decoration: underline; }
  .term-link {
    display: inline-block; margin-top: 10px; font-size: 12px; color: var(--ink-48);
    letter-spacing: -0.12px; text-decoration: none;
  }
  .term-link:hover { color: var(--primary); }

  .empty-note { font-size: 14px; color: var(--ink-48); letter-spacing: -0.224px; padding: 24px 0; }

  footer.site-footer { background: var(--parchment); color: var(--ink-80); padding: 64px 24px 32px; }
  .footer-links { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 32px; }
  .footer-links a { display: block; font-size: 17px; line-height: 2.41; color: var(--ink-80); text-decoration: none; }
  .footer-links a:hover { color: var(--ink); }
  .footer-legal { max-width: 1000px; margin: 32px auto 0; padding-top: 16px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-48); letter-spacing: -0.12px; }

  @media (max-width: 640px) {
    main.content { padding: 48px 20px 72px; }
    h1.headline { font-size: 28px; }
    p.tagline { font-size: 17px; }
    .sub-nav { padding: 0 16px; }
    .sub-nav .category { font-size: 17px; }
    .footer-links { grid-template-columns: repeat(2, 1fr); gap: 4px 20px; }
  }
  @media (max-width: 380px) {
    .global-nav .meta { display: none; }
  }
</style>
</head>
<body>
  <nav class="global-nav">
    <a class="brand" href="../index.html">AI 프로덕트 마스터</a>
    <span class="meta">인공지능 심화(160H)</span>
  </nav>
  <nav class="sub-nav">
    <a class="category" href="#">용어 사전</a>
    <a class="btn-primary" href="../index.html">전체 커리큘럼</a>
  </nav>

  <main class="content">
    <span class="eyebrow">언제든 찾아보는 자료</span>
    <h1 class="headline">기본 용어 사전</h1>
    <p class="tagline">수업에서 계속 나오는 말들을 미리 한 번 훑어 두면 첫 주가 훨씬 편합니다. 용어를 누르면 자세한 설명이 열립니다.</p>

    <div class="filter-row">
      <span class="filter-label">PART</span>
      <nav class="group-tabs" id="group-tabs"></nav>
    </div>
    <div class="filter-row">
      <span class="filter-label">성격</span>
      <nav class="group-tabs kind" id="kind-tabs"></nav>
    </div>

    <label class="search-input">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" placeholder="용어, 원어, 설명으로 검색">
    </label>

    <div class="list-toolbar">
      <p class="result-count" id="result-count"></p>
      <div class="sort-toggle" id="sort-toggle">
        <button data-sort="default" class="active">PART순</button>
        <button data-sort="alpha">가나다순</button>
      </div>
    </div>

    <div class="term-list" id="term-list"></div>
    <p class="empty-note" id="empty-note" style="display:none;">일치하는 용어가 없습니다.</p>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="../00_사전학습/index.html">00 사전 학습</a>
      <a href="../01_오리엔테이션/index.html">01 오리엔테이션</a>
      <a href="../02_바이브코딩/index.html">02 바이브코딩</a>
      <a href="../03_UXUI디자인/index.html">03 UXUI디자인</a>
      <a href="../04_노코드프로토타이핑/index.html">04 노코드프로토타이핑</a>
      <a href="../05_서비스기획/index.html">05 서비스기획</a>
      <a href="../06_데이터ML/index.html">06 데이터ML</a>
      <a href="../07_LLM_RAG_Agent/index.html">07 LLM_RAG_Agent</a>
      <a href="../08_해커톤/index.html">08 해커톤</a>
      <a href="../이슈로그/index.html">이슈로그</a>
      <a href="../팁/index.html">팁</a>
    </div>
    <div class="footer-legal">AI 프로덕트 마스터 · frontierall</div>
  </footer>

  <script>
    // 자료 파일은 캐시를 우회해 불러옵니다.
    // GitHub Pages가 파일을 10분쯤 캐시하기 때문에, 이 처리가 없으면
    // 용어를 추가하고 바로 열어 본 수강생에게는 예전 목록이 보입니다.
    document.write('<script src="terms.js?t=' + Date.now() + '"><\/script>');
  </script>
  <script>
    const listEl = document.getElementById('term-list');
    const tabsEl = document.getElementById('group-tabs');
    const kindTabsEl = document.getElementById('kind-tabs');
    const searchInput = document.getElementById('search');
    const resultCount = document.getElementById('result-count');
    const emptyNote = document.getElementById('empty-note');
    const sortToggle = document.getElementById('sort-toggle');

    const partOf = id => TERM_CATEGORIES.find(c => c.id === id) || { no: '', name: id };
    const partLabel = id => { const p = partOf(id); return p.no ? p.no + ' ' + p.name : p.name; };
    const termById = id => TERMS.find(t => t.id === id);
    let activePart = 'all';
    let activeKind = 'all';
    let sortMode = 'default';

    const kindLabel = id => (TERM_KINDS.find(k => k.id === id) || {}).label || id;

    /* ---- 걸러 보기: PART(언제 배우나) × 성격(개념인가 도구인가) ---- */
    function matches(t, opts) {
      const o = opts || {};
      const part = o.part !== undefined ? o.part : activePart;
      const kind = o.kind !== undefined ? o.kind : activeKind;
      const q = searchInput.value.trim().toLowerCase();
      if (part !== 'all' && t.part !== part) return false;
      if (kind !== 'all' && t.kind !== kind) return false;
      if (q) {
        const haystack = [t.term, t.en || '', t.short, ...(t.body || []), t.note || '',
                          partLabel(t.part), kindLabel(t.kind)].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    }

    /* ---- 두 줄의 탭. 개수는 다른 줄의 선택을 반영해 그때그때 셉니다 ---- */
    function renderTabs() {
      // 아직 용어가 없는 PART · 성격은 탭을 만들지 않습니다.
      const usedParts = TERM_CATEGORIES.filter(c => TERMS.some(t => t.part === c.id));
      const usedKinds = TERM_KINDS.filter(k => TERMS.some(t => t.kind === k.id));

      const rows = [
        { el: tabsEl, attr: 'part', active: activePart,
          groups: [{ id: 'all', label: '전체' }].concat(usedParts.map(c => ({ id: c.id, label: partLabel(c.id) }))) },
        { el: kindTabsEl, attr: 'kind', active: activeKind,
          groups: [{ id: 'all', label: '전체' }].concat(usedKinds.map(k => ({ id: k.id, label: k.label }))) },
      ];

      rows.forEach(row => {
        row.el.innerHTML = row.groups.map(g => {
          const n = TERMS.filter(t => matches(t, row.attr === 'part' ? { part: g.id } : { kind: g.id })).length;
          const cls = [g.id === row.active ? 'active' : '', n === 0 ? 'empty' : ''].join(' ').trim();
          return '<button data-' + row.attr + '="' + g.id + '"' + (cls ? ' class="' + cls + '"' : '') + '>' +
                 '<span class="label">' + g.label + '</span> ' +
                 '<span class="count">(' + n + ')</span></button>';
        }).join('');
      });
    }

    /* ---- 용어 목록 ---- */
    function renderList() {
      const items = [...TERMS];
      if (sortMode === 'alpha') items.sort((a, b) => a.term.localeCompare(b.term, 'ko'));

      listEl.innerHTML = items.map(t => {
        const body = (t.body || []).map(p => '<p>' + p + '</p>').join('');
        const note = t.note ? '<p class="term-note"><b>주의</b> · ' + t.note + '</p>' : '';
        const related = (t.related || [])
          .map(id => termById(id))
          .filter(Boolean)
          .map(r => '<a href="#' + r.id + '" data-jump="' + r.id + '">' + r.term + '</a>')
          .join(', ');
        const relatedLine = related ? '<p class="term-related">관련 용어 · ' + related + '</p>' : '';
        const p = partOf(t.part);
        const partBadge = p.no ? '<span class="badge part">' + p.name + '</span>' : '';
        const enLine = t.en ? '<span class="en">' + t.en + '</span>' : '';
        const emoji = t.emoji ? '<span class="emoji">' + t.emoji + '</span>' : '';

        return [
          '<article class="term" id="' + t.id + '" data-part="' + t.part + '">',
          '  <button class="term-head" type="button" aria-expanded="false" aria-controls="body-' + t.id + '">',
          '    <span class="term-title">' + emoji + '<span class="name">' + t.term + '</span>' + enLine + '</span>',
          '    <span class="term-short">' + t.short + '</span>',
          '    <span class="badges"><span class="badge cat">PART ' + p.no + '</span>' + partBadge +
          '<span class="badge kind">' + kindLabel(t.kind) + '</span></span>',
          '  </button>',
          '  <div class="term-body" id="body-' + t.id + '">',
          body + note + relatedLine,
          '    <a class="term-link" href="#' + t.id + '">이 용어 링크 · #' + t.id + '</a>',
          '  </div>',
          '</article>'
        ].join('');
      }).join('');
    }

    function applyFilters() {
      let visible = 0;
      document.querySelectorAll('.term').forEach(el => {
        const show = matches(termById(el.id));
        el.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      resultCount.textContent = visible + '개 용어';
      emptyNote.style.display = visible === 0 ? 'block' : 'none';
      renderTabs();
    }

    /* ---- 펼치기 ---- */
    function openTerm(id, scroll) {
      const el = document.getElementById(id);
      if (!el || !el.classList.contains('term')) return;
      el.classList.add('open');
      el.querySelector('.term-head').setAttribute('aria-expanded', 'true');
      if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    listEl.addEventListener('click', e => {
      const jump = e.target.closest('[data-jump]');
      if (jump) {
        // 다른 PART·성격에 있는 관련 용어라도 보이도록 필터를 전체로 되돌립니다.
        activePart = 'all';
        activeKind = 'all';
        searchInput.value = '';
        applyFilters();
        openTerm(jump.dataset.jump, true);
        return;
      }
      const head = e.target.closest('.term-head');
      if (!head) return;
      const term = head.closest('.term');
      const open = term.classList.toggle('open');
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    tabsEl.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      activePart = btn.dataset.part;
      applyFilters();
    });

    kindTabsEl.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      activeKind = btn.dataset.kind;
      applyFilters();
    });

    sortToggle.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      sortMode = btn.dataset.sort;
      sortToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      renderList();
      applyFilters();
    });

    searchInput.addEventListener('input', applyFilters);

    renderTabs();
    renderList();
    applyFilters();

    // #ux 처럼 특정 용어를 지목한 링크로 들어오면 그 용어를 열어 줍니다.
    if (location.hash) openTerm(decodeURIComponent(location.hash.slice(1)), true);
    window.addEventListener('hashchange', () => {
      if (location.hash) openTerm(decodeURIComponent(location.hash.slice(1)), true);
    });
  </script>
</body>
</html>
